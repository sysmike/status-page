name: Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.incidents.outputs.changed }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checks
        env:
          CONFIG_VARS: ${{ toJSON(vars) }}
        run: node scripts/check.mjs

      - name: Update incidents
        id: incidents
        env:
          CONFIG_VARS: ${{ toJSON(vars) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/incidents.mjs

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --quiet --cached && exit 0
          git commit -m "chore: status $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          exit 1

  # Pages also rebuilds on its own 15 minute schedule; this keeps outages from
  # waiting for that tick.
  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
